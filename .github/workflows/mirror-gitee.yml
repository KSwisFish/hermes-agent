# Fork 专用:把本 fork 镜像推送到 Gitee(国内分发源)。
# 触发:push 到 main/dev(含 sync-upstream.yml 用 SYNC_TOKEN 推送的上游同步)+ 手动触发。
# 需要在仓库 Settings → Secrets and variables → Actions 中配置:
#   GITEE_USERNAME —— Gitee 用户名(ten-billion)
#   GITEE_TOKEN    —— Gitee 私人令牌(勾选 projects 权限)
name: Mirror to Gitee

on:
  push:
    branches: [main, dev]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    # 防止 workflow 被再次 fork 后在别人仓库里跑
    if: github.repository == 'KSwisFish/hermes-agent'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push all branches and tags to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_USERNAME" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少 GITEE_USERNAME / GITEE_TOKEN secrets,无法镜像到 Gitee"
            exit 1
          fi
          # checkout 默认只拉当前分支,补齐所有远程分支再整体镜像
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/ten-billion/hermes-agent.git"
          git push -f gitee 'refs/remotes/origin/*:refs/heads/*'
          git push -f gitee --tags
          echo "镜像完成:所有分支与标签已同步到 Gitee"
