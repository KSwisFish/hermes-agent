# Fork 专用:把本 fork 的 main 镜像推送到 Gitee(国内分发源)。
# 触发:push 到 main(含 sync-upstream.yml 用 SYNC_TOKEN 推送的上游同步)+ 手动触发。
# 注意:dev(二开分支)由本地直推 gitee/dev 维护,不经此镜像 —— 见 2026-09-02 仓库结构约定。
# 需要在仓库 Settings → Secrets and variables → Actions 中配置:
#   GITEE_USERNAME —— Gitee 用户名(fish_zzc,个人空间地址)
#   GITEE_TOKEN    —— Gitee 私人令牌(勾选 projects 权限)
name: Mirror to Gitee

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    # 防止 workflow 被再次 fork 后在别人仓库里跑
    if: github.repository == 'KSwisFish/hermes-agent'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push main and tags to Gitee
        env:
          GITEE_USERNAME: ${{ secrets.GITEE_USERNAME }}
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          if [ -z "$GITEE_USERNAME" ] || [ -z "$GITEE_TOKEN" ]; then
            echo "::error::缺少 GITEE_USERNAME / GITEE_TOKEN secrets,无法镜像到 Gitee"
            exit 1
          fi
          git fetch origin '+refs/heads/main:refs/remotes/origin/main'
          git remote add gitee "https://${GITEE_USERNAME}:${GITEE_TOKEN}@gitee.com/fish_zzc/hermes-agent.git"
          git push -f gitee refs/remotes/origin/main:refs/heads/main
          git push -f gitee --tags
          echo "镜像完成:main 与标签已同步到 Gitee(dev 由本地直推,不经镜像)"
